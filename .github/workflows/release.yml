# Publish a GitHub Release whenever a vN.N.N tag is pushed, using the
# tagged commit's message as the release notes.
#
# The notes live in the version-bump commit's message (write the changelog
# there, e.g. `git commit -m "0.2.5 — changes from 0.2.4" -m "## Added ..."`).
# CI reads that commit's message via the API and publishes it, so a tag push
# becomes a Release with no local `gh` or web-UI step.  GitHub Actions is free
# for public repos.
#
# Reading the *commit* message (repos/.../commits/<tag> derefs the tag to its
# commit) is deterministic — unlike `gh release create --notes-from-tag`,
# which reads the tag annotation and silently falls back to the commit
# message when the runner's local tag is lightweight (this mis-published
# v0.2.5's first run).  The step is idempotent (edit if the Release exists,
# else create) so a re-pushed tag repairs a bad publish.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create/edit a Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Release from the tagged commit's message
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(gh api "repos/$REPO/commits/$TAG" --jq '.commit.message')
          title="isabelle-query ${TAG#v}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$REPO" --title "$title" --notes "$notes" --verify-tag
          fi

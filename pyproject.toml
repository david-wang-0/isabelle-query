[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-query"
version = "0.6.8"
description = "Query the live theory index of an Isabelle/Isar project — entries, call graph, dependencies, and dead code — by parsing .thy files on every invocation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Authored by András Salamon, with Claude Opus 4.6, 4.7, 4.8, and 5.
authors = [
    { name = "András Salamon", email = "Andras.Salamon@st-andrews.ac.uk" },
]
keywords = [
    "isabelle", "isar", "theorem-proving", "formal-verification",
    "afp", "proof-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

# The ROOT / session / theory-header parsing this tool is built on, split out
# so that consumers who want a parser need not install a CLI to get one.  The
# code is unchanged (verified: 68362 comparisons over the AFP and the Isabelle
# distribution, 0 disagreements); `isabelle_query.common` re-exports it, so no
# caller had to move on the day of the split.
#
# No upper bound, though the dependency is pre-1.0.  Both packages are released
# by the same author and query's suite runs against layout's working tree, so a
# break is found here before it reaches an index.  What makes that more than a
# hope is `tests/test_layout_surface.py`: `common.py` imports all 24 names at
# module level, eight of them private, so a REMOVAL already fails the import and
# takes the whole suite red — that test names them, so the failure says which
# name went and not just that something did.  A silent change of BEHAVIOUR in a
# name that still exists is the residual risk, and the answer to that is to stop
# importing layout's privates, not to write a version range.
#
# The floor is 0.2.2 because that is what is actually ON PyPI — its only
# release.  Naming 0.2.0, which existed only as a local install, would be a
# floor no index can resolve and would read as satisfied by something that
# cannot be fetched.  Verified at 0.2.2: suite green, AFP closure CLOSED over
# 9,910 theories, 57,064 entries unchanged.
dependencies = [
    "isabelle-layout>=0.2.2",
]

[project.scripts]
# Two names, one entry point.  `query` is canonical and what the docs use;
# `isabelle-query` matches the distribution name, so the name a user already
# knows from `pip install isabelle-query` is not the one that fails.  Messages
# reflect whichever was typed — see `cli._prog_name`.
query = "isabelle_query.cli:main"
isabelle-query = "isabelle_query.cli:main"

[project.urls]
Homepage = "https://github.com/ott2/isabelle-query"
Source = "https://github.com/ott2/isabelle-query"

# Dev-only tooling (PEP 735). Not published extras: consumers of isabelle-query
# never need these — the shipped `query` CLI is pure-Python, takes only the
# `isabelle-layout` dependency declared above, and emits raw census JSONL.
#   python -m pip install --group test
[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_query"]

# Without this, hatchling's sdist sweeps in everything git tracks — including
# `.claude/`, which is 23 files of this project's internal working notes.  They
# belong on GitHub; they are not something a `pip install` should carry, and a
# published file can never be replaced.
#
# What stays is what someone installing the package could want: the source, the
# tests (self-contained — they reference `scripts/` only in prose), the docs the
# README links to, and `configs/` — `configs/m3.toml` is documented in
# METRICS.md as shipping, and `shape --config` reads it, so dropping it would
# break a documented workflow.
#
# What goes is development and release infrastructure.  `scripts/` is the
# judgement call: 57 corpus probes that need an AFP checkout to say anything,
# useful for working ON the tool rather than WITH it.
#
# `.gitignore` is NOT listed: hatchling reads it to derive exclusions and ships
# it whatever this says, so an entry for it would be a line that does nothing.
[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    ".mailmap",
    "CLAUDE.md",
    "Makefile",
    "scripts",
    "todo.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-query"
version = "0.6.5"
description = "Query the live theory index of an Isabelle/Isar project — entries, call graph, dependencies, and dead code — by parsing .thy files on every invocation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Authored by András Salamon, with Claude Opus 4.6, 4.7, 4.8, and 5.
authors = [
    { name = "András Salamon", email = "Andras.Salamon@st-andrews.ac.uk" },
]
keywords = [
    "isabelle", "isar", "theorem-proving", "formal-verification",
    "afp", "proof-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

# The ROOT / session / theory-header parsing this tool is built on, split out
# so that consumers who want a parser need not install a CLI to get one.  The
# code is unchanged (verified: 68362 comparisons over the AFP and the Isabelle
# distribution, 0 disagreements); `isabelle_query.common` re-exports it, so no
# caller had to move on the day of the split.
#
# No upper bound, though the dependency is pre-1.0.  Both packages are released
# by the same author and query's suite runs against layout's working tree, so a
# break is found here before it reaches an index.  What makes that more than a
# hope is `tests/test_layout_surface.py`: `common.py` imports all 24 names at
# module level, eight of them private, so a REMOVAL already fails the import and
# takes the whole suite red — that test names them, so the failure says which
# name went and not just that something did.  A silent change of BEHAVIOUR in a
# name that still exists is the residual risk, and the answer to that is to stop
# importing layout's privates, not to write a version range.
#
# The floor is 0.2.0 because that is the first PUBLISHED release: 0.1.x existed
# only as a local install, so an earlier floor names something no index can
# resolve.
dependencies = [
    "isabelle-layout>=0.2.0",
]

[project.scripts]
query = "isabelle_query.cli:main"

[project.urls]
Homepage = "https://github.com/ott2/isabelle-query"
Source = "https://github.com/ott2/isabelle-query"

# Dev-only tooling (PEP 735). Not published extras: consumers of isabelle-query
# never need these — the shipped `query` CLI is pure-Python with zero runtime
# dependencies and emits raw census JSONL.
#   python -m pip install --group test
[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_query"]

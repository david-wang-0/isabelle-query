[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-query"
version = "0.1.0"
description = "Query the live theory index of an Isabelle/Isar project — entries, call graph, dependencies, and dead code — by parsing .thy files on every invocation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Authored by András Salamon, with Claude Opus 4.6, 4.7, and 4.8.
authors = [
    { name = "András Salamon", email = "Andras.Salamon@st-andrews.ac.uk" },
]
keywords = [
    "isabelle", "isar", "theorem-proving", "formal-verification",
    "afp", "proof-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
query = "isabelle_query.cli:main"

[project.urls]
# Set these when the GitHub repo is published:
# Homepage = "https://github.com/<owner>/query"
# Source = "https://github.com/<owner>/query"

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_query"]
